tasks:
  install-tools:
    usage: Install or update tusk task runner
    run:
      - dotnet fsi tools/install-task-runner.fsx
  build:
    usage: Build the application
    run:
      - dotnet build /nowarn:FS0025
  test:
    usage: Run unit tests for entire repository
    run:
      - dotnet test
  clean:
    usage: Remove all build artifacts
    run:
      - dotnet clean
  release:
    usage: Build a release version of application
    options:
      version:
        usage: version of application
        environment: RELEASE_VERSION
        default: "0.0.0"
      runtime:
        usage: target runtime (e.g., linux-x64, win-x64, osx-x64, osx-arm64)
        environment: TARGET_RUNTIME
        default: "linux-x64"
    run:
      - printf '%s\n' "$(git log -n 1 --format=%H)" > VERSION
      - printf '%s\n' "${version}" >> VERSION
      - dotnet publish or -c Release -r ${runtime} --self-contained false /property:Version=${version}
      - cd or/bin/Release/net8.0/${runtime}/publish && cp ../../../../../../VERSION . && tar -czf ../../../../../../operations-research-${version}-${runtime}.tar.gz *.dll VERSION
      - printf 'Archive contents:\n' && tar -tzf operations-research-${version}-${runtime}.tar.gz
